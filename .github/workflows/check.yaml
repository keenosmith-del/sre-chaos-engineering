name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.2'}
      - run: test -z "$(gofmt -l internal services)"
      - run: go test ./... && go build ./...
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm, cache-dependency-path: apps/dashboard/package-lock.json}
      - run: npm ci && npm run build
        working-directory: apps/dashboard
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start local integration stack
        run: |
          docker pull grafana/k6:0.57.0
          docker compose up -d --wait --wait-timeout 180
      - name: Verify bounded transaction, chaos and recovery journey
        timeout-minutes: 5
        run: python3 -u scripts/demo.py
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Collect logs and stop stack
        if: always()
        run: |
          python3 scripts/shutdown.py || true
          docker compose logs --no-color --tail=100
          docker compose down
